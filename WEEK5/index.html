<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 25px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #d5dbe3;
        }
        h1 { text-align: center; color: #203a5f; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input[type="text"], input[type="number"], select {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bdc7d4;
            border-radius: 5px;
        }
        .choice { margin-top: 8px; font-weight: normal; }
        .choice input { margin-right: 6px; }
        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 5px;
            background: #2457a7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #183f80; }
        .note { color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Registration</h1>

        <!-- The form sends data to process.php using POST. -->
        <!-- multipart/form-data is required for file uploading. -->
        <form action="process.php" method="POST" enctype="multipart/form-data">
            <label for="employee_name">Employee Full Name</label>
            <input type="text" id="employee_name" name="employee_name" required>

            <label for="employee_id">Employee ID</label>
            <input type="text" id="employee_id" name="employee_id" required>

            <label>Gender</label>
            <div class="choice">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male" style="display:inline;font-weight:normal;">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" style="display:inline;font-weight:normal;">Female</label>
            </div>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">-- Select Department --</option>
                <option value="Human Resources">Human Resources</option>
                <option value="Finance">Finance</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Administration">Administration</option>
            </select>

            <label>Employment Type</label>
            <div class="choice">
                <input type="radio" id="full_time" name="employment_type" value="Full-Time" required>
                <label for="full_time" style="display:inline;font-weight:normal;">Full-Time</label>
                <input type="radio" id="part_time" name="employment_type" value="Part-Time">
                <label for="part_time" style="display:inline;font-weight:normal;">Part-Time</label>
            </div>

            <label for="basic_salary">Basic Salary ($)</label>
            <input type="number" id="basic_salary" name="basic_salary" min="0.01" step="0.01" required>

            <label for="allowance">Allowance ($)</label>
            <input type="number" id="allowance" name="allowance" min="0" step="0.01" value="0" required>

            <label for="deduction">Deduction ($)</label>
            <input type="number" id="deduction" name="deduction" min="0" step="0.01" value="0" required>

            <label for="years_service">Years of Service</label>
            <input type="number" id="years_service" name="years_service" min="0" step="1" value="0" required>

            <label for="employee_document">Employee Document</label>
            <input type="file" id="employee_document" name="employee_document" required>
            <p class="note">Maximum file size: 2 MB.</p>

            <button type="submit">Register Employee</button>
        </form>
    </div>
</body>
</html>
